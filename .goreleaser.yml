version: 2

project_name: witr

before:
  hooks:
    # Shell completions for the packages below. GoReleaser runs hooks without a
    # shell, so the loop and redirection need an explicit sh -c.
    - sh -c 'mkdir -p completions && for sh in bash zsh fish; do go run ./cmd/witr completion "$sh" > "completions/witr.$sh"; done'

builds:
  - id: witr
    main: ./cmd/witr
    binary: witr
    # Explicit target list: loong64 is a Linux-only architecture, so it must
    # not be added to the shared goarch list (that would try darwin/loong64 etc.).
    targets:
      - linux_amd64
      - linux_arm64
      - linux_loong64
      - darwin_amd64
      - darwin_arm64
      - freebsd_amd64
      - freebsd_arm64
      - windows_amd64
      - windows_arm64
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pranshuparmar/witr/internal/version.Version=v{{ .Version }}
      - -X github.com/pranshuparmar/witr/internal/version.Commit={{ .Commit }}
      - -X github.com/pranshuparmar/witr/internal/version.BuildDate={{ .Date }}

archives:
  - id: binaries
    formats:
      - binary
    format_overrides:
      - goos: windows
        formats: [ 'zip' ]
    ids:
      - witr
    name_template: "witr-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

nfpms:
  - id: witr
    package_name: witr
    file_name_template: "witr-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    formats:
      - apk
      - deb
      - rpm
    maintainer: Pranshu Parmar <pranshu.parmar@gmail.com>
    description: witr explains why a process or port is running by tracing its ancestry.
    homepage: https://github.com/pranshuparmar/witr
    license: Apache-2.0
    contents:
      - src: docs/cli/witr.1
        dst: /usr/share/man/man1/witr.1
        file_info:
          mode: 0644
      - src: completions/witr.bash
        dst: /usr/share/bash-completion/completions/witr
        file_info:
          mode: 0644
      # Debian's zsh searches vendor-completions; Fedora's and Alpine's search site-functions.
      - src: completions/witr.zsh
        dst: /usr/share/zsh/vendor-completions/_witr
        packager: deb
        file_info:
          mode: 0644
      - src: completions/witr.zsh
        dst: /usr/share/zsh/site-functions/_witr
        packager: rpm
        file_info:
          mode: 0644
      - src: completions/witr.zsh
        dst: /usr/share/zsh/site-functions/_witr
        packager: apk
        file_info:
          mode: 0644
      - src: completions/witr.fish
        dst: /usr/share/fish/vendor_completions.d/witr.fish
        file_info:
          mode: 0644

changelog:
  sort: asc
  use: github-native

release:
  extra_files:
    - glob: docs/cli/witr.1
